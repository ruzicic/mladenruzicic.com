name: E2E

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Playwright + axe
    steps:
      - uses: actions/checkout@v4

      # Before `pnpm install`, so the source hash below never walks
      # node_modules. Restores Turbopack's incremental cache; the key falls
      # back to the newest cache for this lockfile when sources changed.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'lib/**', 'content/**', 'types/**', 'next.config.ts', 'postcss.config.mjs', 'proxy.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # Its own step, not part of `webServer.command`: a cold Next 16 build on
      # a 2-core runner can outlast any sensible server-start timeout, and a
      # build failure should read as a build failure rather than as "Timed out
      # waiting for the web server". `webServer` then only has to start
      # `next start`, which takes well under a second.
      - name: Build
        run: pnpm build

      - name: Run E2E suite
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
