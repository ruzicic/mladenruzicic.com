name: Code check

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    name: Lint, typecheck, build
    steps:
      - uses: actions/checkout@v4

      # Before `pnpm install`, so the source hash never walks node_modules.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'lib/**', 'content/**', 'types/**', 'next.config.ts', 'postcss.config.mjs', 'proxy.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
